<title id="title">Adhi Naik — animated portfolio dashboard</title>
<desc id="desc">A multi-panel dark portfolio dashboard inspired by the supplied reference: illustrated profile, animated systems map, project previews, skill panels, activity chart and contact card. It is a portfolio illustration, not a live dashboard.</desc>
