<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Adhi Naik — interactive-style animated engineering portfolio dashboard</title>
<desc id="desc">A richly detailed midnight-blue portfolio interface with a custom illustrated profile card, animated orbital visualization, project tiles, skill clusters, engineering workflow, and glowing data visualizations. Metrics describe verified portfolio categories rather than invented performance.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d1b"/><stop offset=".52" stop-color="#0c1730"/><stop offset="1" stop-color="#17152f"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141f3b"/><stop offset="1" stop-color="#10172b"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#4cf1ff"/><stop offset="1" stop-color="#4aa7ff"/></linearGradient>
 <linearGradient id="violet"><stop stop-color="#8e7cff"/><stop offset="1" stop-color="#c18bff"/></linearGradient>
 <linearGradient id="pink"><stop stop-color="#ff79c8"/><stop offset="1" stop-color="#ffb27d"/></linearGradient>
 <linearGradient id="title"><stop stop-color="#ffffff"/><stop offset=".48" stop-color="#a6f6ff"/><stop offset="1" stop-color="#d2b4ff"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#685eff" stop-opacity=".3"/><stop offset="1" stop-color="#685eff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7188c7" stroke-opacity=".06"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect width="1200" height="720" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
