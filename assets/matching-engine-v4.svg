<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
 <title id="title">Low-Latency Matching Engine</title><desc id="desc">A clean visual showing limit orders entering bid and ask queues, meeting at a deterministic price-time matching core, and producing trade events.</desc>
 <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="core"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><pattern id="g" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#94A3B8" stroke-opacity=".11"/></pattern></defs>
 <rect width="1200" height="340" rx="22" fill="url(#b)"/><rect width="1200" height="340" rx="22" fill="url(#g)"/>
 <text x="38" y="42" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">C++20 / ORDER BOOK / PRICE-TIME PRIORITY</text>
 <text x="38" y="82" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750">Low-Latency Matching Engine</text>
 <g font-family="JetBrains Mono,Consolas,monospace" font-size="13">
  <rect x="38" y="125" width="190" height="156" rx="12" fill="#0B1B2F" stroke="#22C55E" stroke-opacity=".55"/><text x="58" y="153" fill="#86EFAC" font-weight="700">BID QUEUE</text>
  <rect x="58" y="170" width="150" height="25" rx="5" fill="#14532D" fill-opacity=".65"/><text x="70" y="187" fill="#BBF7D0">101.25 × 200</text>
  <rect x="58" y="202" width="150" height="25" rx="5" fill="#14532D" fill-opacity=".4"/><text x="70" y="219" fill="#BBF7D0">101.20 × 150</text>
  <rect x="58" y="234" width="150" height="25" rx="5" fill="#14532D" fill-opacity=".25"/><text x="70" y="251" fill="#BBF7D0">101.15 × 100</text>
  <rect x="972" y="125" width="190" height="156" rx="12" fill="#0B1B2F" stroke="#F87171" stroke-opacity=".65"/><text x="992" y="153" fill="#FCA5A5" font-weight="700">ASK QUEUE</text>
  <rect x="992" y="170" width="150" height="25" rx="5" fill="#7F1D1D" fill-opacity=".65"/><text x="1004" y="187" fill="#FECACA">101.25 × 120</text>
  <rect x="992" y="202" width="150" height="25" rx="5" fill="#7F1D1D" fill-opacity=".4"/><text x="1004" y="219" fill="#FECACA">101.30 × 100</text>
  <rect x="992" y="234" width="150" height="25" rx="5" fill="#7F1D1D" fill-opacity=".25"/><text x="1004" y="251" fill="#FECACA">101.35 × 200</text>
 </g>
 <g fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M228 202H320" stroke="#4ADE80"/><path d="M310 194L320 202L310 210" stroke="#4ADE80"/><path d="M972 202H880" stroke="#F87171"/><path d="M890 194L880 202L890 210" stroke="#F87171"/><path d="M600 222V266" stroke="#67E8F9"/><path d="M592 258L600 266L608 258" stroke="#67E8F9"/></g>
 <rect x="320" y="125" width="560" height="97" rx="16" fill="#101D35" stroke="url(#core)" stroke-width="2"/>
 <text x="600" y="160" text-anchor="middle" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">DETERMINISTIC CORE</text>
 <text x="600" y="190" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Price → Time → Fill</text>
 <rect x="452" y="267" width="296" height="34" rx="8" fill="#083344" stroke="#0891B2" stroke-opacity=".8"/><text x="600" y="289" text-anchor="middle" fill="#A5F3FC" font-family="JetBrains Mono,Consolas,monospace" font-size="13">TRADE / EVENT OUTPUT</text>
</svg>