<rect x="204" y="104" width="150" height="86" rx="10" fill="#111D3B" stroke="#818CF8"/><text x="279" y="133" fill="#C7D2FE">Signature</text><text x="279" y="151" fill="#C7D2FE">verification</text><text x="279" y="173" fill="#64748B" font-size="10">RSA-PSS</text>
<rect x="380" y="104" width="150" height="86" rx="10" fill="#111D3B" stroke="#A78BFA"/><text x="455" y="133" fill="#DDD6FE">Replay +</text><text x="455" y="151" fill="#DDD6FE">idempotency</text><text x="455" y="173" fill="#64748B" font-size="10">Defenses</text>
<rect x="556" y="104" width="150" height="86" rx="10" fill="#102B30" stroke="#2DD4BF"/><text x="631" y="133" fill="#99F6E4">Store-and-</text><text x="631" y="151" fill="#99F6E4">forward queue</text><text x="631" y="173" fill="#64748B" font-size="10">Simulation</text>
