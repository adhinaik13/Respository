<g transform="translate(210 174)">
 <circle r="107" fill="url(#core)"/><ellipse rx="140" ry="49" fill="none" stroke="#49e9ff" stroke-opacity=".7" stroke-width="1.5" transform="rotate(-24)"><animateTransform attributeName="transform" type="rotate" from="-24" to="336" dur="22s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="140" ry="49" fill="none" stroke="#aa98ff" stroke-opacity=".7" stroke-width="1.5" transform="rotate(54)"><animateTransform attributeName="transform" type="rotate" from="54" to="414" dur="28s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="140" ry="49" fill="none" stroke="#ff82cb" stroke-opacity=".65" stroke-width="1.5" transform="rotate(90)"/>
 <circle r="48" fill="#131a30" stroke="url(#sg)" stroke-width="2"/><circle r="37" fill="none" stroke="#45527a" stroke-dasharray="3 5"/>
 <path d="M-19 -9L-5 -22L9 -9L-5 4Z M-5 4L-19 17L-5 30L9 17L-5 4 M9 -9L23 4L9 17" fill="none" stroke="#69eaff" stroke-width="3" stroke-linejoin="round"/>
 <text x="0" y="65" text-anchor="middle" fill="#dce5ff" font-family="monospace" font-size="10">CORE</text>
 <g font-family="monospace" font-size="11" font-weight="700"><circle cx="-119" cy="-47" r="18" fill="#102d3b" stroke="#35eaff"/><text x="-119" y="-43" fill="#80f0ff" text-anchor="middle">C++</text><circle cx="110" cy="-53" r="18" fill="#251c40" stroke="#a99aff"/><text x="110" y="-49" fill="#d0c6ff" text-anchor="middle">Py</text><circle cx="5" cy="105" r="18" fill="#321a34" stroke="#ff82cb"/><text x="5" y="109" fill="#ffb7e1" text-anchor="middle">SQL</text></g>
</g>
<!-- stack chips -->
<path d="M408 51V291" stroke="#38405e"/>
<text x="444" y="67" fill="#edf1ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Tools I build with</text>
<text x="444" y="87" fill="#8998bd" font-family="Arial,sans-serif" font-size="12">Grouped by the kind of problems they solve.</text>
<g font-family="monospace" font-size="11">
 <text x="444" y="119" fill="#6eeaff" letter-spacing="1.2">SYSTEMS &amp; PERFORMANCE</text>
 <g><rect x="444" y="132" width="91" height="31" rx="8" fill="#102b38" stroke="#35dff4"/><text x="489" y="152" fill="#82f0ff" text-anchor="middle">C++20</text><rect x="545" y="132" width="94" height="31" rx="8" fill="#151d34" stroke="#435b8a"/><text x="592" y="152" fill="#c5d4ff" text-anchor="middle">CMake</text><rect x="649" y="132" width="92" height="31" rx="8" fill="#151d34" stroke="#435b8a"/><text x="695" y="152" fill="#c5d4ff" text-anchor="middle">Linux</text></g>
 <text x="770" y="119" fill="#b5a5ff" letter-spacing="1.2">BACKEND &amp; DATA</text>
 <g><rect x="770" y="132" width="86" height="31" rx="8" fill="#211b3d" stroke="#9c8aff"/><text x="813" y="152" fill="#cbbfff" text-anchor="middle">Python</text><rect x="866" y="132" width="92" height="31" rx="8" fill="#211b3d" stroke="#9c8aff"/><text x="912" y="152" fill="#cbbfff" text-anchor="middle">FastAPI</text><rect x="968" y="132" width="98" height="31" rx="8" fill="#211b3d" stroke="#9c8aff"/><text x="1017" y="152" fill="#cbbfff" text-anchor="middle">Postgres</text><rect x="1076" y="132" width="88" height="31" rx="8" fill="#211b3d" stroke="#9c8aff"/><text x="1120" y="152" fill="#cbbfff" text-anchor="middle">SQL</text></g>
 <text x="444" y="198" fill="#ff9bd6" letter-spacing="1.2">PRODUCT &amp; DELIVERY</text>
 <g><rect x="444" y="211" width="91" height="31" rx="8" fill="#321b35" stroke="#f57bc3"/><text x="489" y="231" fill="#ffb8e1" text-anchor="middle">Java</text><rect x="545" y="211" width="126" height="31" rx="8" fill="#321b35" stroke="#f57bc3"/><text x="608" y="231" fill="#ffb8e1" text-anchor="middle">Spring Boot</text><rect x="681" y="211" width="91" height="31" rx="8" fill="#321b35" stroke="#f57bc3"/><text x="726" y="231" fill="#ffb8e1" text-anchor="middle">React</text><rect x="782" y="211" width="119" height="31" rx="8" fill="#321b35" stroke="#f57bc3"/><text x="841" y="231" fill="#ffb8e1" text-anchor="middle">TypeScript</text><rect x="911" y="211" width="83" height="31" rx="8" fill="#321b35" stroke="#f57bc3"/><text x="952" y="231" fill="#ffb8e1" text-anchor="middle">Git</text><rect x="1004" y="211" width="93" height="31" rx="8" fill="#321b35" stroke="#f57bc3"/><text x="1050" y="231" fill="#ffb8e1" text-anchor="middle">Docker</text></g>
</g>
<text x="444" y="279" fill="#8794b8" font-family="Arial,sans-serif" font-size="12">The goal isn't to collect tools. It's to choose the right one and verify the result.</text>
<path d="M444 291H1165" stroke="url(#sg)" stroke-opacity=".55"/><circle cx="444" cy="291" r="3" fill="#6eeaff"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
