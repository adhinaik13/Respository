<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Engineering stack and tools</title><desc id="d">A glowing orbital systems core paired with grouped technology chips on a midnight background.</desc>
<defs><linearGradient id="sbg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171128"/></linearGradient><linearGradient id="sg"><stop stop-color="#35eaff"/><stop offset=".52" stop-color="#a99aff"/><stop offset="1" stop-color="#ff7cc9"/></linearGradient><radialGradient id="core"><stop stop-color="#7defff" stop-opacity=".5"/><stop offset="1" stop-color="#7defff" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="320" rx="24" fill="url(#sbg)" stroke="#353958"/>
<text x="30" y="32" fill="#6ceaff" font-family="monospace" font-size="11" letter-spacing="2.5">03 / THE TOOLKIT</text><text x="1170" y="32" fill="#7582a8" font-family="monospace" font-size="10" text-anchor="end">A STACK IS A SET OF TRADE-OFFS</text>
