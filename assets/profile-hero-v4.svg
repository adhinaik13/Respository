<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Vankudothu Adhi Naik — Systems, software, and data</title>
  <desc id="desc">An editorial dark navy and indigo systems-engineering banner with grid lines, terminal-inspired panels, and clear professional typography.</desc>
  <defs>
