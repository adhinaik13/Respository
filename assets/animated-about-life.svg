<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">What Adhi builds and what drives him</title><desc id="d">Two premium glass panels: a terminal-style engineering card and an animated three-frame interests carousel.</desc>
<defs><linearGradient id="bg2" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#15112a"/></linearGradient><linearGradient id="line2"><stop stop-color="#36e8ff"/><stop offset=".5" stop-color="#9d8cff"/><stop offset="1" stop-color="#ff7fc8"/></linearGradient><pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8a9bff" opacity=".16"/></pattern></defs>
<rect width="1200" height="330" rx="24" fill="url(#bg2)" stroke="#353958"/><rect width="1200" height="330" rx="24" fill="url(#dots2)"/>
<text x="30" y="31" fill="#6ceaff" font-family="monospace" font-size="11" letter-spacing="2.5">02 / THE BUILDER BEHIND THE CODE</text>
<!-- left browser -->
<rect x="28" y="49" width="560" height="252" rx="17" fill="#0d1424" stroke="#34415f"/>
<path d="M28 86H588" stroke="#34415f"/><circle cx="49" cy="68" r="4" fill="#ff6f91"/><circle cx="64" cy="68" r="4" fill="#ffd36e"/><circle cx="79" cy="68" r="4" fill="#4ee4bc"/>
<rect x="112" y="58" width="338" height="20" rx="7" fill="#151f35"/><text x="126" y="72" fill="#7f91b8" font-family="monospace" font-size="10">adhi@workstation: ~/engineering</text>
<text x="51" y="119" fill="#8d9aba" font-family="monospace" font-size="12">$ whoami</text><text x="51" y="143" fill="#f3f5ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">A builder obsessed with the details.</text>
<text x="51" y="168" fill="#b7c1df" font-family="Arial,sans-serif" font-size="13">I like systems that are understandable, testable,</text><text x="51" y="187" fill="#b7c1df" font-family="Arial,sans-serif" font-size="13">and resilient when real-world inputs get messy.</text>
<g font-family="monospace" font-size="11">
 <rect x="51" y="210" width="153" height="29" rx="7" fill="#102832" stroke="#2bd8ed" stroke-opacity=".65"/><text x="127" y="228" fill="#7cefff" text-anchor="middle">01 / THINK DEEPLY</text>
 <rect x="214" y="210" width="153" height="29" rx="7" fill="#201b38" stroke="#a696ff" stroke-opacity=".65"/><text x="290" y="228" fill="#c7bcff" text-anchor="middle">02 / TEST EDGES</text>
 <rect x="377" y="210" width="176" height="29" rx="7" fill="#301a32" stroke="#f57bc3" stroke-opacity=".65"/><text x="465" y="228" fill="#ffb1df" text-anchor="middle">03 / SHIP CLEANLY</text>
</g>
<text x="51" y="274" fill="#627391" font-family="monospace" font-size="10">CURRENT MODE:</text><text x="162" y="274" fill="#60efc7" font-family="monospace" font-size="10">LEARN → BUILD → VERIFY</text><rect x="367" y="266" width="10" height="13" fill="#56e7ff"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
<!-- right carousel -->
<rect x="608" y="49" width="564" height="252" rx="17" fill="#101426" stroke="#3b3c60"/>
<text x="632" y="75" fill="#a8b5da" font-family="monospace" font-size="10" letter-spacing="2">OFF THE TERMINAL</text>
<g transform="translate(632 92)">
 <rect width="516" height="130" rx="13" fill="#171b35" stroke="#4b4a75"/>
 <circle cx="448" cy="55" r="42" fill="#28224b"/><circle cx="448" cy="55" r="29" fill="none" stroke="#a99bff" stroke-width="1.5" stroke-dasharray="4 5"><animateTransform attributeName="transform" type="rotate" from="0 448 55" to="360 448 55" dur="14s" repeatCount="indefinite"/></circle>
 <path d="M418 77L442 35L461 65L478 43" fill="none" stroke="#64e9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="442" cy="35" r="4" fill="#ff83cc"/>
 <g opacity="1"><text x="20" y="31" fill="#6eeaff" font-family="monospace" font-size="10">01 / SYSTEMS THINKING</text><text x="20" y="59" fill="#f3f5ff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Find the edge case.</text><text x="20" y="83" fill="#b5bedb" font-family="Arial,sans-serif" font-size="12">Then make it a test that never lets the bug back in.</text><animate attributeName="opacity" values="1;.35;1" dur="4s" repeatCount="indefinite"/></g>
</g>
