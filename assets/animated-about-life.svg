<rect x="632" y="235" width="164" height="3" rx="1.5" fill="#2b3552"/><rect x="632" y="235" width="164" height="3" rx="1.5" fill="#55e7ff"><animate attributeName="width" values="0;164;0" dur="4s" repeatCount="indefinite"/></rect>
<rect x="804" y="235" width="164" height="3" rx="1.5" fill="#2b3552"/><rect x="976" y="235" width="172" height="3" rx="1.5" fill="#2b3552"/>
