<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t"><title id="t">About Adhi — systems, learning, and building</title><defs><linearGradient id="g" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs><rect width="1200" height="250" rx="20" fill="#0d0e16" stroke="#29283c"/><text x="32" y="38" fill="#22d3ee" font-family="monospace" font-size="12" letter-spacing="3">02 / WHAT I BUILD</text><g font-family="Arial,sans-serif"><rect x="30" y="58" width="350" height="158" rx="14" fill="#151725" stroke="#343149"/><text x="54" y="91" fill="#f5f5fb" font-size="20" font-weight="700">Systems &amp; performance</text><text x="54" y="119" fill="#b8b8ce" font-size="14">Deterministic behavior, data structures,</text><text x="54" y="140" fill="#b8b8ce" font-size="14">concurrency and edge-case testing.</text><rect x="54" y="164" width="140" height="6" rx="3" fill="#24263a"/><rect x="54" y="164" width="100" height="6" rx="3" fill="url(#g)"><animate attributeName="width" values="70;140;100" dur="5s" repeatCount="indefinite"/></rect><rect x="400" y="58" width="350" height="158" rx="14" fill="#151725" stroke="#343149"/><text x="424" y="91" fill="#f5f5fb" font-size="20" font-weight="700">Backend &amp; data</text><text x="424" y="119" fill="#b8b8ce" font-size="14">Reliable APIs, persistence, validation,</text><text x="424" y="140" fill="#b8b8ce" font-size="14">migrations and useful observability.</text><rect x="424" y="164" width="140" height="6" rx="3" fill="#24263a"/><rect x="424" y="164" width="116" height="6" rx="3" fill="url(#g)"><animate attributeName="width" values="100;140;116" dur="6s" repeatCount="indefinite"/></rect><rect x="770" y="58" width="400" height="158" rx="14" fill="#151725" stroke="#343149"/><text x="794" y="91" fill="#f5f5fb" font-size="20" font-weight="700">Current interests</text><g font-family="monospace" font-size="13"><rect x="794" y="108" width="116" height="30" rx="8" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="852" y="127" fill="#22d3ee" text-anchor="middle">Open source</text><rect x="920" y="108" width="105" height="30" rx="8" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".5"/><text x="972" y="127" fill="#c4b5fd" text-anchor="middle">Developer tools</text><rect x="1035" y="108" width="110" height="30" rx="8" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".5"/><text x="1090" y="127" fill="#f9a8d4" text-anchor="middle">AI systems</text><text x="794" y="171" fill="#aaaac1">Learn deeply. Build carefully.</text><text x="794" y="191" fill="#aaaac1">Ship improvements that can be verified.</text></g></g></svg>