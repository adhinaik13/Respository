<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Adhi Naik — animated developer portfolio</title>
<desc id="desc">A dark, polished developer portfolio with violet and cyan lighting, a profile identity panel, animated orbital system map, and featured engineering projects.</desc>
