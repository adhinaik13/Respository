<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">FluxQueue durable job processing architecture</title><desc id="desc">A dark dashboard showing API submission, PostgreSQL-backed queue, leased workers, retries, and dead-letter handling.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#192b3a"/></linearGradient></defs><rect width="1200" height="360" rx="24" fill="url(#bg)"/><text x="36" y="34" fill="#f4c95d" font-family="monospace" font-size="12" letter-spacing="3">JOB PROCESSING / 03</text><text x="36" y="76" fill="#f6f0e6" font-family="Arial,sans-serif" font-weight="700" font-size="32">FluxQueue</text><text x="36" y="101" fill="#b9c9d8" font-family="Arial,sans-serif" font-size="15">Durable jobs · idempotent submission · fenced worker leases</text>
<g font-family="monospace" font-size="12"><rect x="36" y="142" width="210" height="126" rx="14" fill="#1e3040" stroke="#40576b"/><text x="56" y="169" fill="#ef8557">01 / API</text><text x="56" y="198" fill="#f6f0e6" font-size="15">POST /jobs</text><text x="56" y="222" fill="#b9c9d8">tenant key</text><text x="56" y="244" fill="#c9ed63">idempotency key</text>
<rect x="320" y="142" width="260" height="126" rx="14" fill="#1e3040" stroke="#40576b"/><text x="340" y="169" fill="#ef8557">02 / POSTGRESQL</text><text x="340" y="198" fill="#f6f0e6" font-size="15">Durable job state</text><text x="340" y="222" fill="#b9c9d8">queued → leased</text><text x="340" y="244" fill="#c9ed63">fencing token</text>
<rect x="654" y="142" width="220" height="126" rx="14" fill="#1e3040" stroke="#40576b"/><text x="674" y="169" fill="#ef8557">03 / WORKER</text><text x="674" y="198" fill="#f6f0e6" font-size="15">Lease + heartbeat</text><text x="674" y="222" fill="#b9c9d8">bounded retries</text><text x="674" y="244" fill="#c9ed63">stale token rejected</text>
<rect x="948" y="142" width="216" height="126" rx="14" fill="#1e3040" stroke="#40576b"/><text x="968" y="169" fill="#ef8557">04 / OUTCOME</text><text x="968" y="198" fill="#c9ed63" font-size="15">Succeeded</text><text x="968" y="222" fill="#f4c95d">Retry scheduled</text><text x="968" y="244" fill="#ef8557">Dead-letter</text></g>
