<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Adhi Naik — animated engineering portfolio</title>
<desc id="desc">A readable dark portfolio dashboard with an illustrated profile, bold identity statement, animated orbital system graphic and four featured project cards. Designed to remain legible when scaled inside a GitHub README.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090c1a"/><stop offset=".52" stop-color="#11162d"/><stop offset="1" stop-color="#21132f"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2242"/><stop offset="1" stop-color="#11172d"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#65edff"/><stop offset="1" stop-color="#5b9dff"/></linearGradient>
 <linearGradient id="violet"><stop stop-color="#8a7aff"/><stop offset="1" stop-color="#c28aff"/></linearGradient>
 <linearGradient id="pink"><stop stop-color="#ff83ca"/><stop offset="1" stop-color="#ffb77f"/></linearGradient>
 <linearGradient id="titleGrad"><stop stop-color="#ffffff"/><stop offset=".53" stop-color="#d4d2ff"/><stop offset="1" stop-color="#81eeff"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#7862ff" stop-opacity=".36"/><stop offset="1" stop-color="#7862ff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#a5b1ed" stroke-opacity=".06"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="frame"><rect width="1200" height="720" rx="24"/></clipPath>
 <clipPath id="portrait"><rect x="34" y="126" width="264" height="294" rx="14"/></clipPath>
</defs>
