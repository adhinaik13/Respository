<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Adhi Naik — systems, backend engineering, and developer tools</title><desc id="desc">A clean cinematic midnight portfolio banner with large readable typography and animated abstract orbital geometry.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset=".55" stop-color="#10172b"/><stop offset="1" stop-color="#21122d"/></linearGradient><linearGradient id="edge"><stop stop-color="#40eaff"/><stop offset=".5" stop-color="#9e91ff"/><stop offset="1" stop-color="#ff7fc8"/></linearGradient><linearGradient id="type"><stop stop-color="#fff"/><stop offset=".45" stop-color="#7defff"/><stop offset=".8" stop-color="#b7a8ff"/><stop offset="1" stop-color="#ffacd9"/></linearGradient><radialGradient id="aura"><stop stop-color="#5a68ff" stop-opacity=".24"/><stop offset="1" stop-color="#5a68ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9aa9ff" stroke-opacity=".065"/></pattern></defs>
