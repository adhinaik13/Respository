<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Adhi Naik — systems, backend engineering, and developer tools</title><desc id="desc">A clean cinematic midnight portfolio banner with large readable typography and real GitHub profile portrait framed by animated orbital geometry.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset=".55" stop-color="#10172b"/><stop offset="1" stop-color="#21122d"/></linearGradient><linearGradient id="edge"><stop stop-color="#40eaff"/><stop offset=".5" stop-color="#9e91ff"/><stop offset="1" stop-color="#ff7fc8"/></linearGradient><linearGradient id="type"><stop stop-color="#fff"/><stop offset=".45" stop-color="#7defff"/><stop offset=".8" stop-color="#b7a8ff"/><stop offset="1" stop-color="#ffacd9"/></linearGradient><radialGradient id="aura"><stop stop-color="#5a68ff" stop-opacity=".24"/><stop offset="1" stop-color="#5a68ff" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9aa9ff" stroke-opacity=".065"/></pattern></defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/><rect width="1200" height="390" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="url(#edge)" stroke-opacity=".7"/><ellipse cx="950" cy="190" rx="260" ry="230" fill="url(#aura)"><animate attributeName="opacity" values=".65;1;.65" dur="6s" repeatCount="indefinite"/></ellipse>
<text x="52" y="47" fill="#68eaff" font-family="monospace" font-size="12" letter-spacing="3">ADHI NAIK / ENGINEERING PORTFOLIO</text><rect x="52" y="66" width="226" height="31" rx="15" fill="#10262f" stroke="#37dfe8" stroke-opacity=".65"/><circle cx="70" cy="81" r="4" fill="#5bf0c8"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle><text x="84" y="85" fill="#c7fff2" font-family="monospace" font-size="11" letter-spacing=".6">BUILDING IN PUBLIC</text>
<text x="52" y="151" fill="#d9e3ff" font-family="Arial,sans-serif" font-size="21">Hi, I'm</text><text x="48" y="214" fill="url(#type)" font-family="Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="-2">Adhi Naik.</text><text x="53" y="251" fill="#f0f3ff" font-family="Arial,sans-serif" font-size="21">I build systems that stay predictable under pressure.</text><text x="53" y="282" fill="#aebbd9" font-family="Arial,sans-serif" font-size="16">Systems programming · Backend platforms · Developer tools · Open source</text>
<g font-family="monospace" font-size="11"><rect x="52" y="309" width="139" height="34" rx="8" fill="#102b38" stroke="#39e3f4"/><text x="121" y="330" fill="#86f1ff" text-anchor="middle">SYSTEMS</text><rect x="202" y="309" width="139" height="34" rx="8" fill="#211c3d" stroke="#a99aff"/><text x="271" y="330" fill="#d0c6ff" text-anchor="middle">BACKEND</text><rect x="352" y="309" width="159" height="34" rx="8" fill="#301b35" stroke="#f47fc4"/><text x="431" y="330" fill="#ffb6df" text-anchor="middle">OPEN SOURCE</text></g><text x="53" y="368" fill="#7788ad" font-family="monospace" font-size="11">INTEGRATED M.TECH · MATHEMATICS &amp; COMPUTING · IIT (ISM) DHANBAD</text>
