<text x="30" y="326" fill="#7f8eb2" font-family="monospace" font-size="10">IDENTITY ISN'T A TITLE — IT'S THE QUALITY OF THE SYSTEMS YOU LEAVE BEHIND.</text><text x="1170" y="326" fill="#64eaff" font-family="monospace" font-size="10" text-anchor="end">BUILD / TEST / LEARN</text>
