<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d">
<title id="t">Adhi Naik developer identity card and engineering dashboard</title><desc id="d">A swinging holographic ID badge sits beside a glass dashboard highlighting engineering focus, projects, and working principles.</desc>
<defs><linearGradient id="db" x2="1" y2="1"><stop stop-color="#0a0f1e"/><stop offset="1" stop-color="#17122b"/></linearGradient><linearGradient id="metal"><stop stop-color="#3de8ff"/><stop offset=".45" stop-color="#a99aff"/><stop offset="1" stop-color="#ff83cc"/></linearGradient><linearGradient id="foil" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffffff" stop-opacity="0"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".55" stop-color="#7ef4ff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="350" rx="24" fill="url(#db)" stroke="#353958"/><text x="30" y="32" fill="#6ceaff" font-family="monospace" font-size="11" letter-spacing="2.5">04 / BUILDER IDENTITY + SIGNALS</text>
