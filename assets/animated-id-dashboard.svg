  <text x="0" y="195" fill="#f0f4ff" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">ADHI NAIK</text>
  <text x="0" y="211" fill="#91a2ca" font-family="monospace" font-size="8" text-anchor="middle">SYSTEMS / BACKEND</text>
  <rect x="-50" y="222" width="100" height="5" rx="2.5" fill="#293552"/><rect x="-50" y="222" width="68" height="5" rx="2.5" fill="url(#metal)"/>
