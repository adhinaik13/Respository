<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="t d"><title id="t">UPI Offline Mesh</title><desc id="d">An offline payment flow linking signed QR payloads, store-and-forward delivery, and idempotent settlement.</desc><rect width="720" height="170" rx="16" fill="#111827"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="31" fill="#D9F75A" font-size="12" letter-spacing="2.5" font-weight="700">BACKEND / SECURITY</text><rect x="28" y="55" width="178" height="76" rx="10" fill="#202A3A" stroke="#45516A"/><text x="117" y="84" fill="#F7F8FC" text-anchor="middle" font-size="15" font-weight="700">SIGNED QR</text><text x="117" y="106" fill="#AEB7CA" text-anchor="middle" font-size="12">AES-GCM · RSA-PSS</text><path d="M213 93H271" stroke="#315CFF" stroke-width="3"/><path d="M261 84l11 9-11 9" fill="none" stroke="#315CFF" stroke-width="3"/><rect x="280" y="55" width="160" height="76" rx="10" fill="#315CFF"/><text x="360" y="84" fill="#FFFFFF" text-anchor="middle" font-size="15" font-weight="700">STORE / FORWARD</text><text x="360" y="106" fill="#E5E9FF" text-anchor="middle" font-size="12">offline queue</text><path d="M447 93H505" stroke="#D9F75A" stroke-width="3"/><path d="M495 84l11 9-11 9" fill="none" stroke="#D9F75A" stroke-width="3"/><rect x="514" y="55" width="178" height="76" rx="10" fill="#202A3A" stroke="#45516A"/><text x="603" y="84" fill="#F7F8FC" text-anchor="middle" font-size="15" font-weight="700">SETTLEMENT</text><text x="603" y="106" fill="#AEB7CA" text-anchor="middle" font-size="12">replay / idempotency</text></g></svg>