<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">What Adhi builds and what keeps him curious</title><desc id="desc">Two midnight-glass panels showing engineering capabilities and an animated interests carousel.</desc><defs><linearGradient id="aurora"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#aab4d4" opacity=".12"/></pattern></defs>
<rect width="1200" height="350" rx="24" fill="#0d0e16"/><rect x="1" y="1" width="1198" height="348" rx="23" fill="none" stroke="url(#aurora)" stroke-opacity=".6"/>
<rect x="22" y="22" width="565" height="306" rx="18" fill="#131624" stroke="#3c4565"/><rect x="22" y="22" width="565" height="306" rx="18" fill="url(#dots)"/><rect x="613" y="22" width="565" height="306" rx="18" fill="#131624" stroke="#3c4565"/><rect x="613" y="22" width="565" height="306" rx="18" fill="url(#dots)"/>
<g font-family="Arial,sans-serif"><text x="48" y="57" font-size="19" font-weight="700" fill="#f4f2ff">WHAT I BUILD</text><text x="48" y="78" font-size="11" font-family="monospace" fill="#8f9abf">CAPABILITIES / 01—03</text>
<rect x="48" y="98" width="48" height="48" rx="12" fill="#142f3a" stroke="#22d3ee"/><text x="61" y="128" font-size="22" fill="#67e8f9">⌘</text><text x="113" y="116" font-size="15" fill="#f4f2ff" font-weight="700">Reliable backend systems</text><text x="113" y="137" font-size="12" fill="#aeb7d5">APIs, durable jobs, data boundaries and failure recovery.</text>
<rect x="48" y="163" width="48" height="48" rx="12" fill="#241d3c" stroke="#a78bfa"/><text x="61" y="193" font-size="22" fill="#c4b5fd">◇</text><text x="113" y="181" font-size="15" fill="#f4f2ff" font-weight="700">Systems & performance</text><text x="113" y="202" font-size="12" fill="#aeb7d5">C++ experiments, benchmarks and explicit invariants.</text>
<rect x="48" y="228" width="48" height="48" rx="12" fill="#351d31" stroke="#f472b6"/><text x="61" y="258" font-size="22" fill="#f9a8d4">⌁</text><text x="113" y="246" font-size="15" fill="#f4f2ff" font-weight="700">Developer tooling</text><text x="113" y="267" font-size="12" fill="#aeb7d5">Search, observability and workflows with evidence.</text>
<text x="640" y="57" font-size="19" font-weight="700" fill="#f4f2ff">BEYOND THE TERMINAL</text><text x="640" y="78" font-size="11" font-family="monospace" fill="#8f9abf">CURIOSITY / CAROUSEL</text>
<g><rect x="640" y="100" width="510" height="110" rx="14" fill="#0e1220" stroke="#343c5a"/><text x="665" y="139" font-size="27" fill="#22d3ee">⌘</text><text x="708" y="133" font-size="18" font-weight="700" fill="#f4f2ff">Building side projects</text><text x="708" y="157" font-size="13" fill="#aeb7d5">Turning ideas into useful, testable software.</text><text x="708" y="179" font-size="12" fill="#a78bfa">BUILD → TEST → IMPROVE</text><animate attributeName="opacity" values="1;.72;1" dur="4s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="640" y="100" width="510" height="110" rx="14" fill="#0e1220" stroke="#343c5a"/><text x="665" y="139" font-size="27" fill="#a78bfa">◌</text><text x="708" y="133" font-size="18" font-weight="700" fill="#f4f2ff">Open-source learning</text><text x="708" y="157" font-size="13" fill="#aeb7d5">Small, careful contributions and readable fixes.</text><text x="708" y="179" font-size="12" fill="#f472b6">LEARN IN PUBLIC</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.35;.7;1" dur="8s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="640" y="100" width="510" height="110" rx="14" fill="#0e1220" stroke="#343c5a"/><text x="665" y="139" font-size="27" fill="#f472b6">◎</text><text x="708" y="133" font-size="18" font-weight="700" fill="#f4f2ff">Exploring product ideas</text><text x="708" y="157" font-size="13" fill="#aeb7d5">Understanding people, systems and trade-offs.</text><text x="708" y="179" font-size="12" fill="#22d3ee">CURIOSITY FIRST</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.6;.95;1" dur="8s" repeatCount="indefinite"/></g>
<rect x="640" y="229" width="510" height="5" rx="2" fill="#30354d"/><rect x="640" y="229" width="170" height="5" rx="2" fill="#22d3ee"><animate attributeName="x" values="640;810;980;640" dur="8s" repeatCount="indefinite"/></rect>
<g transform="translate(640 251)"><circle cx="22" cy="22" r="18" fill="none" stroke="#30354d" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="75 113" transform="rotate(-90 22 22)"><animate attributeName="stroke-dasharray" values="10 113;75 113;10 113" dur="4s" repeatCount="indefinite"/></circle><text x="51" y="19" font-size="12" fill="#f4f2ff">Curiosity</text><text x="51" y="34" font-size="10" fill="#8f9abf">always on</text></g>
<g transform="translate(810 251)"><circle cx="22" cy="22" r="18" fill="none" stroke="#30354d" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="#a78bfa" stroke-width="4" stroke-dasharray="62 113" transform="rotate(-90 22 22)"><animate attributeName="stroke-dasharray" values="8 113;62 113;8 113" dur="5s" repeatCount="indefinite"/></circle><text x="51" y="19" font-size="12" fill="#f4f2ff">Consistency</text><text x="51" y="34" font-size="10" fill="#8f9abf">one commit at a time</text></g>
<g transform="translate(1000 251)"><circle cx="22" cy="22" r="18" fill="none" stroke="#30354d" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="#f472b6" stroke-width="4" stroke-dasharray="82 113" transform="rotate(-90 22 22)"><animate attributeName="stroke-dasharray" values="10 113;82 113;10 113" dur="6s" repeatCount="indefinite"/></circle><text x="51" y="19" font-size="12" fill="#f4f2ff">Growth</text><text x="51" y="34" font-size="10" fill="#8f9abf">learn by shipping</text></g></g></svg>