name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s site/index.html
          grep -q '<title>' site/index.html
          grep -q 'prefers-reduced-motion' site/index.html
          grep -q 'aria-label="Main navigation"' site/index.html
          grep -q 'id="menuBtn" type="button"' site/index.html
          grep -q 'aria-expanded="false" aria-controls="navlinks"' site/index.html
          grep -q "document.addEventListener('keydown'" site/index.html
          grep -q 'style.colorScheme=dark' site/index.html
          grep -q 'developer-avatar-talking.svg' site/index.html
          python3 -c "from pathlib import Path; import json, re; s=Path('site/index.html').read_text(); m=re.search(r'<script type=\"application/ld\\+json\">([\\s\\S]*?)</script>', s); assert m, 'JSON-LD missing'; d=json.loads(m.group(1)); assert d.get('@type') == 'Person' and d.get('name') == 'Adi Naik', 'JSON-LD profile invalid'"
          test -s site/assets/developer-avatar-talking.svg
          python3 -c "from pathlib import Path; import re; s=Path('site/index.html').read_text(); m=re.search(r'<script>([\\s\\S]*?)</script>', s); assert m, 'inline script missing'; Path('/tmp/portfolio-inline.js').write_text(m.group(1))"
          node --check /tmp/portfolio-inline.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("site/index.html").read_text()
          images = re.findall(r"<img\b[^>]*>", html)
          assert images and all(re.search(r"\balt=(['\"]).+?\1", image) for image in images), "Every image must have non-empty alt text"
          assert len(re.findall(r"<h1\b", html)) == 1, "Page must have exactly one h1"
          assert len(re.findall(r"<main\b", html)) == 1, "Page must have one main landmark"
          assert not re.search(r"<a\b[^>]*href=['\"]#['\"]", html), "Placeholder links are not allowed"
          assert not re.search(r"<a\b[^>]*target=['\"]_blank['\"](?![^>]*\brel=)", html), "External new-tab links must declare rel"
          buttons = re.findall(r"<button\b[^>]*>", html)
          assert buttons and all(re.search(r"\btype=['\"]button['\"]", button) for button in buttons), "Every button must declare type=button"
          details = re.findall(r"<details\b[^>]*>([\s\S]*?)</details>", html)
          assert len(details) >= 4 and all(re.search(r"<summary\b", item) for item in details), "Project detail disclosures need summaries"
          from html.parser import HTMLParser

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.fragments = []
                  self.aria_refs = []
                  self.unsafe_external = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "a" and attrs.get("href", "").startswith("#"):
                      self.fragments.append(attrs["href"][1:])
                  for key in ("aria-controls", "aria-labelledby", "aria-describedby"):
                      self.aria_refs.extend(attrs.get(key, "").split())
                  if tag == "a" and attrs.get("target") == "_blank":
                      rel = set(attrs.get("rel", "").lower().split())
                      if not {"noopener", "noreferrer"} & rel:
                          self.unsafe_external.append(attrs.get("href", "(unknown)"))

          audit = Audit()
          audit.feed(html)
          assert len(audit.ids) == len(set(audit.ids)), "Duplicate HTML IDs found"
          known_ids = set(audit.ids)
          assert all(ref in known_ids for ref in audit.fragments), "Broken internal fragment link"
          assert all(ref in known_ids for ref in audit.aria_refs), "Broken ARIA ID reference"
          assert not audit.unsafe_external, f"Unsafe target=_blank links: {audit.unsafe_external}"
          print(f"Portfolio checks passed: {len(images)} images, {len(buttons)} buttons, {len(details)} disclosures")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
