name: Update 3D contribution profile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"
      - "README.md"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: vankudothuadhinaik
      - name: Commit generated profile
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          git commit -m "chore: refresh 3D contribution profile"
          # Other profile workflows may have advanced main after this job checked out.
          # Rebase the generated asset commit onto the latest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; refreshing main and retrying."
            git rebase --abort || true
            sleep 2
          done
          echo "Could not push generated 3D contribution assets after three attempts."
          exit 1
