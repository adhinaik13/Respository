name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install lightweight workflow dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Fetch public contribution calendar
        run: python scripts/fetch_contributions.py
      - name: Render animated heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Regenerate static profile art
        run: |
          python scripts/make_ascii_svg.py
          python scripts/make_info_card.py
      - name: Commit changed profile art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh animated profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg avi-ascii.svg info-card.svg"
