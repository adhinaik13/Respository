<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Adhi Naik — animated developer hero</title><desc id="desc">Midnight glass hero with animated gradient name, cycling engineering roles, open to collaboration pill, and a vector character illustration. A personal video was not supplied, so this uses original inline vector art.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d0e16"/><stop offset=".6" stop-color="#17152a"/><stop offset="1" stop-color="#101a2b"/></linearGradient><linearGradient id="aurora"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><radialGradient id="glow"><stop stop-color="#a78bfa" stop-opacity=".24"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#aab4d4" opacity=".13"/></pattern><clipPath id="screen"><rect x="744" y="40" width="410" height="330" rx="20"/></clipPath></defs>
<rect width="1200" height="410" rx="26" fill="url(#bg)"/><rect width="1200" height="410" rx="26" fill="url(#dots)"/><rect x="1" y="1" width="1198" height="408" rx="25" fill="none" stroke="url(#aurora)" stroke-opacity=".65"/>
<circle cx="920" cy="185" r="280" fill="url(#glow)"><animate attributeName="opacity" values=".6;1;.6" dur="7s" repeatCount="indefinite"/></circle>
<g font-family="Arial,sans-serif"><rect x="54" y="43" width="177" height="31" rx="15" fill="#102d32" stroke="#22d3ee" stroke-opacity=".6"/><circle cx="72" cy="58" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="85" y="63" font-size="12" fill="#b9f6ff" letter-spacing=".5">OPEN TO COLLABS</text>
<text x="55" y="122" font-size="19" fill="#c5c8dd">Hi there, I'm</text><text x="52" y="191" font-size="61" font-weight="800" fill="url(#aurora)">Adhi Naik<animate attributeName="opacity" values=".35;1;1" keyTimes="0;.45;1" dur="1.4s" fill="freeze"/></text><text x="57" y="235" font-size="18" fill="#f0eefe">I build reliable systems, backend platforms</text><text x="57" y="261" font-size="18" fill="#f0eefe">and tools that make developers faster.</text>
<text x="57" y="310" font-family="monospace" font-size="14" fill="#22d3ee">▸ SYSTEMS ENGINEERING</text><text x="57" y="334" font-family="monospace" font-size="14" fill="#a78bfa" opacity="0">▸ BACKEND PLATFORMS<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.8;1" dur="4s" repeatCount="indefinite"/></text><text x="57" y="358" font-family="monospace" font-size="14" fill="#f472b6">▸ DEVELOPER TOOLS · OPEN SOURCE</text>
