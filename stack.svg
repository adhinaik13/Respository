<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Adhi's technology stack</title><desc id="desc">Three animated elliptical orbits around a glowing core, plus grouped technology chips.</desc><defs><linearGradient id="aurora"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><radialGradient id="core"><stop stop-color="#22d3ee" stop-opacity=".8"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#aab4d4" opacity=".12"/></pattern></defs><rect width="1200" height="420" rx="24" fill="#0d0e16"/><rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#aurora)" stroke-opacity=".6"/><rect width="1200" height="420" rx="24" fill="url(#dots)"/>
<g transform="translate(280 210)"><circle r="120" fill="url(#core)"><animate attributeName="r" values="110;130;110" dur="5s" repeatCount="indefinite"/></circle><ellipse rx="160" ry="60" fill="none" stroke="#22d3ee" stroke-opacity=".55" transform="rotate(-25)"/><ellipse rx="160" ry="60" fill="none" stroke="#a78bfa" stroke-opacity=".6" transform="rotate(38)"/><ellipse rx="160" ry="60" fill="none" stroke="#f472b6" stroke-opacity=".55" transform="rotate(90)"/><circle r="52" fill="#17172c" stroke="url(#aurora)" stroke-width="2"/><text x="0" y="-5" font-family="monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#f4f2ff">TECH</text><text x="0" y="17" font-family="monospace" font-size="11" text-anchor="middle" fill="#aeb7d5">ORBIT</text>
<g><circle cx="160" cy="0" r="20" fill="#122d39" stroke="#22d3ee"/><text x="160" y="5" font-family="monospace" font-size="11" text-anchor="middle" fill="#a5f3fc">C++</text><animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/></g><g><circle cx="0" cy="-60" r="20" fill="#251d3d" stroke="#a78bfa"/><text x="0" y="-56" font-family="monospace" font-size="10" text-anchor="middle" fill="#ddd6fe">PY</text><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="24s" repeatCount="indefinite"/></g><g><circle cx="-160" cy="0" r="20" fill="#351d31" stroke="#f472b6"/><text x="-160" y="5" font-family="monospace" font-size="10" text-anchor="middle" fill="#fbcfe8">SQL</text><animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/></g></g>
<g font-family="Arial,sans-serif"><text x="530" y="58" fill="#f4f2ff" font-size="21" font-weight="700">THE TOOLKIT</text><text x="530" y="80" fill="#8f9abf" font-family="monospace" font-size="11">GROUPED BY WHAT I USE IT FOR</text>
<text x="530" y="120" fill="#22d3ee" font-size="13" font-weight="700">SYSTEMS &amp; BACKEND</text>
