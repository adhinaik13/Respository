<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Adi Naik — systems engineering portfolio</title>
<desc id="desc">A dark technical portfolio illustration with a glowing lime systems map, backend service cards, terminal output, and engineering metrics.</desc>
<defs>
